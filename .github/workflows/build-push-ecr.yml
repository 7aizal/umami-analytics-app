name: Build and Push Umami Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag override (defaults to sha-<commit>)"
        required: false
        type: string
      push_latest:
        description: "Also push :latest"
        required: false
        default: false
        type: boolean
  push:
    branches: ["main", "develop"]
    paths:
      - "app/**"
      - ".github/workflows/build-push-ecr.yml"

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: umami

concurrency:
  group: build-push-umami-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag + uri
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
          else
            IMAGE_TAG="sha-${GITHUB_SHA}"
          fi

          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          echo "IMAGE_URI=${IMAGE_URI}"

      - name: Build image
        run: |
          docker build -t "${IMAGE_URI}" -f app/Dockerfile app

      - name: Trivy scan (non-blocking)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "${{ env.IMAGE_URI }}"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Push image
        run: |
          docker push "${IMAGE_URI}"

      - name: Push latest (optional)
        if: ${{ inputs.push_latest == true }}
        run: |
          LATEST_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"
          docker tag "${IMAGE_URI}" "${LATEST_URI}"
          docker push "${LATEST_URI}"