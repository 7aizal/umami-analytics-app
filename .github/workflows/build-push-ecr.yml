name: Build and Push Umami Image

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "app/**"
      - ".github/workflows/build-push-ecr.yml"

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: umami

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          IMAGE_TAG=sha-${GITHUB_SHA}
          IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}
          docker build -t "${IMAGE_URI}" -f app/Dockerfile app
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV

      - name: Trivy scan (non-blocking)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "${{ env.IMAGE_URI }}"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Push image
        run: |
          docker push "${{ env.IMAGE_URI }}"