      name: Build and Push to ECR
      on:
        push:
          branches:
            - main
      jobs:
        build:
          runs-on: ubuntu-latest
          steps:
            - name: Set image tags
              run: |
                IMAGE_BASE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
                SHA_TAG="sha-${GITHUB_SHA}"
      
                echo "IMAGE_BASE=${IMAGE_BASE}" >> "$GITHUB_ENV"
                echo "SHA_TAG=${SHA_TAG}" >> "$GITHUB_ENV"
      
            - name: Build image (sha + latest)
              run: |
                docker build \
                  -t "${IMAGE_BASE}:${SHA_TAG}" \
                  -t "${IMAGE_BASE}:latest" \
                  -f app/Dockerfile app
      
            - name: Trivy scan (non-blocking)
              uses: aquasecurity/trivy-action@0.24.0
              with:
                image-ref: "${{ env.IMAGE_BASE }}:${{ env.SHA_TAG }}"
                format: "table"
                exit-code: "0"
                ignore-unfixed: true
                vuln-type: "os,library"
                severity: "CRITICAL,HIGH"
      
            - name: Push image (sha + latest)
              run: |
                docker push "${IMAGE_BASE}:${SHA_TAG}"
                docker push "${IMAGE_BASE}:latest"